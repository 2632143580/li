name: Build LI web dist

# 自动把 LI 网页构建成 dist 并发布成 GitHub Release。
# 手机 App（LI-Android）启动时读取最新 Release，自动下载解压使用（热更新），
# 因此改网页（ESM）只需推到本仓库，无需重新打包安装 App。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack dist
        run: cd dist && zip -r ../li-dist.zip . && cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dist-${{ github.run_number }}
          name: LI 网页构建 #${{ github.run_number }}
          files: li-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
