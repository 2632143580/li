<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LI 性能能力诊断</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #0d1018; color: #e8ecf4; font-size: 14px; line-height: 1.7; }
  h1 { font-size: 17px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .row .name { color: #9aa3b2; }
  .ok { color: #4ade80; font-weight: bold; }
  .bad { color: #ff5a5a; font-weight: bold; }
  .warn { color: #ffd479; font-weight: bold; }
  .ua { font-size: 12px; color: #9aa3b2; word-break: break-all; margin-top: 14px; padding: 8px; background: rgba(255,255,255,.05); border-radius: 6px; }
  .tip { margin-top: 14px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.06); font-size: 13px; }
  .run { margin-top: 12px; padding: 9px 18px; background: #1c2433; color: #e8ecf4; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; font-size: 14px; cursor: pointer; }
  .run:disabled { opacity: .5; }
  #stress { margin-top: 10px; }
</style>
</head>
<body>
<h1>性能能力诊断（给 LI 用）</h1>
<div id="out"></div>
<button class="run" id="btn-stress">跑压测（约 6 秒，测 FPS 底子）</button>
<div id="stress"></div>
<div class="tip">如果压测 FPS 掉到 45 以下，说明这台设备的绘制/合成能力偏弱——LI 上的高占用可能部分是设备底子问题。
  要测 <b>LI 页面实时性能</b>（帧驱动源 / 动画 / clearRect），请在 LI 地址后加 <b>?perf=1</b> 打开。</div>
<div class="ua" id="ua"></div>
<script>
(function () {
  function row(label, html) {
    var el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<span class="name">' + label + '</span><span>' + html + '</span>';
    document.getElementById('out').appendChild(el);
  }
  function fmtFps(fps) {
    if (fps >= 55) return '<span class="ok">' + fps.toFixed(0) + ' fps</span>';
    if (fps >= 45) return '<span class="warn">' + fps.toFixed(0) + ' fps</span>';
    return '<span class="bad">' + fps.toFixed(0) + ' fps</span>';
  }
  document.getElementById('ua').textContent = 'UA: ' + navigator.userAgent;

  row('devicePixelRatio', String(window.devicePixelRatio || 1));
  row('逻辑核数 hardwareConcurrency', String(navigator.hardwareConcurrency || '未知'));
  row('内存 deviceMemory（GB）', String(navigator.deviceMemory || '未知（非 Chromium）'));
  row('触控支持', ('ontouchstart' in window) ? '<span class="ok">支持</span>' : '<span class="warn">不支持</span>');
  row('prefers-reduced-motion', matchMedia('(prefers-reduced-motion: reduce)').matches ? '<span class="warn">开启（动画将被缩短）</span>' : '未开启');
  row('Canvas 2D', (function(){ try { var c=document.createElement('canvas').getContext('2d'); return c ? '<span class="ok">可用</span>' : '<span class="bad">不可用</span>'; } catch(e){ return '<span class="bad">异常</span>'; } })());

  // —— FPS 压测 ——
  function measureFps(drawFn, ms, cleanup) {
    return new Promise(function (resolve) {
      var frames = 0, t0 = performance.now();
      function loop(t) {
        drawFn(t);
        frames++;
        if (performance.now() - t0 < ms) requestAnimationFrame(loop);
        else { cleanup && cleanup(); resolve(frames / ((performance.now() - t0) / 1000)); }
      }
      requestAnimationFrame(loop);
    });
  }
  var stressBox = document.getElementById('stress');
  var btn = document.getElementById('btn-stress');
  btn.addEventListener('click', function () {
    btn.disabled = true;
    stressBox.innerHTML = '';
    var lines = [];
    // 1) JS 全屏 canvas 绘制压力：clearRect + 800 随机矩形（测 JS 绘制 + 填充率上限）
    var cv = document.createElement('canvas');
    cv.width = Math.min(window.innerWidth * (window.devicePixelRatio || 1), 1400);
    cv.height = Math.min(window.innerHeight * (window.devicePixelRatio || 1), 1400);
    cv.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d');
    measureFps(function (t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var i = 0; i < 800; i++) {
        ctx.fillStyle = 'rgba(' + ((i * 37) % 255) + ',' + ((i * 91) % 255) + ',180,0.5)';
        ctx.fillRect((i * 173) % cv.width, (i * 97) % cv.height, 40, 40);
      }
    }, 2000, function () { cv.remove(); }).then(function (fps) {
      lines.push('<div class="row"><span class="name">JS 绘制压测（全屏 canvas 800 矩形）</span><span>' + fmtFps(fps) + '</span></div>');
      // 2) 合成器压测：100 个 transform 动画元素（测 GPU 合成器上限）
      var host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-9999px;top:0;width:100%;';
      for (var i = 0; i < 100; i++) {
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(80,160,255,.6);' +
          'left:' + ((i * 37) % 90) + '%;top:' + ((i * 53) % 90) + '%;animation:d'+ i +' 1.2s ease-in-out infinite;';
        host.appendChild(d);
      }
      var st = '<style id="stress-kf">';
      for (var j = 0; j < 100; j++) {
        st += '@keyframes d'+j+'{0%,100%{transform:translateY(0)}50%{transform:translateY(-'+(8+(j%14))+'px)}}';
      }
      st += '</style>';
      var kf = document.createElement('style'); kf.id = 'stress-kf'; kf.textContent = st;
      document.head.appendChild(kf);
      document.body.appendChild(host);
      measureFps(function(){}, 2000, function () { host.remove(); kf.remove(); }).then(function (fps2) {
        lines.push('<div class="row"><span class="name">合成器压测（100 个 transform 动画）</span><span>' + fmtFps(fps2) + '</span></div>');
        stressBox.innerHTML = lines.join('');
        btn.disabled = false;
      });
    });
  });
})();
</script>
</body>
</html>
