<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>依赖图谱 · 点击聚焦层级</title>
    <style>
        :root {
            --bg-primary: #0b0e17;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.30);
            --accent: rgba(150, 220, 130, 0.85);
            --accent-dim: rgba(150, 220, 130, 0.25);
            --radius: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            --font: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, 'SF Mono', monospace;
            --transition: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .app-header {
            flex-shrink: 0; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 14, 23, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        .app-header h1 {
            font-size: 18px; font-weight: 600; letter-spacing: 0.3px;
            background: linear-gradient(135deg, var(--accent), #a8d8ea);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .app-header .stats { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-secondary); }
        .app-header .stats span { display: inline-flex; align-items: center; gap: 5px; }
        .app-header .stats .num { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }

        .app-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

        .config-panel {
            width: 400px; min-width: 280px; flex-shrink: 0;
            padding: 16px 18px; overflow-y: auto;
            border-right: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            display: flex; flex-direction: column; gap: 12px;
        }

        .config-panel .panel-label {
            font-size: 12px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
            color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between;
        }

        .config-panel .panel-label .badge {
            font-size: 10px; text-transform: none;
            background: var(--accent-dim); color: var(--accent);
            padding: 2px 10px; border-radius: 100px; letter-spacing: 0;
        }

        #jsonEditor {
            flex: 1; min-height: 140px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 12px 14px; font-family: var(--mono);
            font-size: 12px; line-height: 1.7; color: var(--text-primary);
            resize: none; outline: none; transition: border-color var(--transition);
            tab-size: 2; white-space: pre; overflow: auto;
        }

        #jsonEditor:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
        #jsonEditor::placeholder { color: var(--text-muted); }

        .config-actions { display: flex; flex-wrap: wrap; gap: 8px; }

        .config-actions button {
            padding: 7px 18px; border: none; border-radius: var(--radius);
            background: var(--bg-card); color: var(--text-secondary);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all var(--transition); font-family: var(--font);
            border: 1px solid transparent; flex: 1 0 auto;
        }

        .config-actions button:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-color); }
        .config-actions button.primary { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
        .config-actions button.primary:hover { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
        .config-actions button.danger { color: #f87171; }
        .config-actions button.danger:hover { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.25); }

        .config-hint { font-size: 12px; color: var(--text-muted); line-height: 1.6; padding: 8px 2px; }
        .config-hint code { background: rgba(255, 255, 255, 0.06); padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--text-secondary); }

        .params-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px 14px; margin-top: 4px; }
        .params-panel .params-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.3px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .params-panel .params-title button { background: none; border: 1px solid var(--border-color); color: var(--text-muted); padding: 2px 12px; border-radius: 100px; font-size: 11px; cursor: pointer; transition: all var(--transition); }
        .params-panel .params-title button:hover { color: var(--text-primary); border-color: var(--text-secondary); }

        .param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .param-row label { font-size: 12px; color: var(--text-secondary); min-width: 70px; flex-shrink: 0; }
        .param-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--border-color); border-radius: 2px; outline: none; cursor: pointer; }
        .param-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-primary); cursor: pointer; }
        .param-row input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-primary); cursor: pointer; }
        .param-row .param-value { font-size: 13px; color: var(--text-primary); min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
        .param-row .param-unit { font-size: 11px; color: var(--text-muted); margin-left: -4px; }

        .viz-panel { flex: 1; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, rgba(150, 220, 130, 0.03), transparent 70%); }
        #vizContainer { width: 100%; height: 100%; position: relative; }
        #vizContainer svg { display: block; width: 100%; height: 100%; }

        .legend {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(11, 14, 23, 0.88);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 12px 16px; font-size: 12px; color: var(--text-secondary);
            display: flex; flex-direction: column; gap: 8px;
            pointer-events: auto; z-index: 5; box-shadow: var(--shadow); min-width: 150px;
        }

        .legend-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 3px 4px; border-radius: 4px; transition: background var(--transition); user-select: none; }
        .legend-item:hover { background: rgba(255, 255, 255, 0.06); }
        .legend-item .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.10); transition: opacity 0.2s; }
        .legend-item .label { font-size: 12px; transition: opacity 0.2s; }
        .legend-item.hidden .dot { opacity: 0.25; }
        .legend-item.hidden .label { opacity: 0.4; text-decoration: line-through; }
        .legend-item .toggle-badge { margin-left: auto; font-size: 10px; background: var(--bg-card); padding: 0 8px; border-radius: 100px; color: var(--text-muted); transition: all 0.2s; }
        .legend-item.hidden .toggle-badge { background: transparent; color: var(--text-muted); }
        .legend-item:not(.hidden) .toggle-badge { background: var(--accent-dim); color: var(--accent); }

        .legend-all { border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 2px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .legend-all .legend-item { cursor: pointer; padding: 2px 10px; border-radius: 100px; background: var(--bg-card); }
        .legend-all .legend-item:hover { background: var(--bg-card-hover); }

        .focus-indicator {
            position: absolute; top: 12px; left: 12px;
            background: rgba(11, 14, 23, 0.8);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 8px 14px; font-size: 12px; color: var(--text-secondary);
            z-index: 6; display: none; pointer-events: none;
        }
        .focus-indicator strong { color: var(--text-primary); }

        #tooltip {
            position: fixed; pointer-events: none; z-index: 100;
            background: rgba(11, 14, 23, 0.94);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 14px 18px; max-width: 300px; box-shadow: var(--shadow);
            color: var(--text-primary); font-size: 13px; line-height: 1.6;
            opacity: 0; transition: opacity 0.18s ease; display: none;
        }
        #tooltip.visible { opacity: 1; display: block; }
        #tooltip .tt-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; word-break: break-word; }
        #tooltip .tt-path { font-size: 12px; color: var(--text-secondary); font-family: var(--mono); word-break: break-all; }
        #tooltip .tt-detail { margin-top: 6px; font-size: 12px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 6px; }
        #tooltip .tt-detail .tag { display: inline-block; background: var(--accent-dim); color: var(--accent); padding: 0 8px; border-radius: 100px; font-size: 11px; margin-right: 4px; }

        .context-menu {
            position: absolute; background: rgba(11, 14, 23, 0.96);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 6px; box-shadow: var(--shadow); z-index: 200;
            display: none; min-width: 140px;
        }
        .context-menu.visible { display: block; }
        .context-menu .menu-header { font-size: 11px; color: var(--text-muted); padding: 4px 10px 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
        .context-menu .menu-item { padding: 6px 12px; font-size: 13px; color: var(--text-primary); cursor: pointer; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: background 0.15s; }
        .context-menu .menu-item:hover { background: var(--accent-dim); color: var(--accent); }
        .context-menu .menu-item.active { color: var(--accent); font-weight: 500; }
        .context-menu .menu-item .check { opacity: 0; font-size: 12px; }
        .context-menu .menu-item.active .check { opacity: 1; }

        @media (max-width: 820px) {
            .app-body { flex-direction: column; }
            .config-panel { width: 100%; min-width: 0; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border-color); padding: 12px 14px; }
            #jsonEditor { min-height: 100px; font-size: 11px; }
            .params-panel { padding: 10px 12px; }
            .param-row { flex-wrap: wrap; gap: 4px; }
            .param-row label { min-width: 60px; font-size: 11px; }
            .param-row .param-value { min-width: 40px; font-size: 12px; }
            .viz-panel { flex: 1; min-height: 0; }
            .legend { bottom: 12px; right: 12px; padding: 10px 14px; font-size: 11px; min-width: 120px; }
            .focus-indicator { top: 8px; left: 8px; font-size: 11px; padding: 6px 10px; }
            .app-header { padding: 10px 16px; }
            .app-header h1 { font-size: 16px; }
            .app-header .stats { font-size: 12px; gap: 10px; }
            .config-actions button { font-size: 12px; padding: 6px 12px; }
        }

        @media (max-width: 480px) {
            .app-header .stats span:not(:first-child) { display: none; }
            .app-header .stats span:first-child .num { font-size: 14px; }
            .config-panel { max-height: 45vh; padding: 10px 12px; }
            #jsonEditor { min-height: 80px; font-size: 10px; padding: 8px 10px; }
            .params-panel { padding: 8px 10px; }
            .param-row label { min-width: 50px; font-size: 10px; }
            .param-row .param-value { min-width: 30px; font-size: 11px; }
            .legend { bottom: 8px; right: 8px; padding: 8px 12px; font-size: 10px; min-width: 100px; }
            .legend-item .dot { width: 10px; height: 10px; }
            .focus-indicator { top: 6px; left: 6px; font-size: 10px; padding: 4px 8px; }
            #tooltip { max-width: 240px; padding: 10px 14px; font-size: 12px; }
            #tooltip .tt-title { font-size: 13px; }
            .app-header h1 { font-size: 14px; }
        }

        .hidden { display: none !important; }

        .viz-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 14px; pointer-events: none; z-index: 4; }
        .viz-loading .spinner { width: 28px; height: 28px; border: 2px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .viz-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; flex-direction: column; gap: 8px; pointer-events: none; z-index: 3; }
        .viz-empty svg { width: 48px; height: 48px; opacity: 0.3; }

        .node-label { font-size: 11px; font-weight: 500; pointer-events: none; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 4px rgba(0, 0, 0, 0.5); }
        .link-line { stroke-linecap: round; }
        .node-circle { stroke: rgba(255, 255, 255, 0.15); stroke-width: 1.5; transition: stroke-width 0.2s, stroke 0.2s; cursor: pointer; }
        .node-circle:hover { stroke-width: 2.5; stroke: rgba(255, 255, 255, 0.5); }
        .node-circle.slice-active { stroke: #F5C542; stroke-width: 3; }
        .node-circle.slice-active:hover { stroke: #FFD97A; stroke-width: 3.5; }

        .header-action {
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid var(--accent-dim); padding: 6px 16px;
            border-radius: var(--radius); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all var(--transition); font-family: var(--font);
        }
        .header-action:hover { background: var(--accent); color: var(--bg-primary); }

        .slice-bar {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-secondary); flex-wrap: wrap;
        }
        .slice-bar .slice-count { color: #F5C542; font-weight: 500; }
        .slice-bar button {
            background: none; border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 2px 12px; border-radius: 100px; font-size: 11px; cursor: pointer;
            transition: all var(--transition);
        }
        .slice-bar button:hover { color: var(--text-primary); border-color: var(--text-secondary); }

        .context-menu .menu-divider { height: 1px; background: var(--border-color); margin: 4px 6px; }
        .context-menu .menu-item.slice { color: #F5C542; }
        .context-menu .menu-item.slice.active { background: rgba(245, 197, 66, 0.12); }

        .viz-empty.viz-error { color: #f87171; }

        .prompt-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center; z-index: 300;
        }
        .prompt-modal.visible { display: flex; }
        .prompt-panel {
            width: min(760px, 92vw); max-height: 88vh; overflow-y: auto;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow);
            display: flex; flex-direction: column; gap: 12px;
        }
        .prompt-panel .pm-header { display: flex; align-items: center; justify-content: space-between; }
        .prompt-panel .pm-header h2 { font-size: 15px; font-weight: 500; }
        .prompt-panel .pm-close { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; padding: 4px 8px; }
        .prompt-panel .pm-close:hover { color: var(--text-primary); }
        .prompt-block { border: 1px solid var(--border-color); border-radius: var(--radius); padding: 10px 12px; background: rgba(255,255,255,0.02); }
        .prompt-block .pm-block-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; user-select: none; }
        .prompt-block .pm-block-title input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
        .pm-toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 96px; overflow-y: auto; }
        .pm-toc .toc-chip {
            font-family: var(--mono); font-size: 11px; color: var(--text-secondary);
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-color);
            border-radius: 100px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
            transition: all var(--transition); max-width: 260px; overflow: hidden; text-overflow: ellipsis;
        }
        .pm-toc .toc-chip:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }
        .prompt-block textarea {
            width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary); font-family: var(--mono);
            font-size: 12px; line-height: 1.6; padding: 10px; resize: vertical; outline: none; margin-top: 8px;
        }
        .prompt-block textarea:focus { border-color: var(--accent); }
        .pm-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .pm-actions button {
            padding: 8px 22px; border: none; border-radius: var(--radius);
            font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font);
            transition: all var(--transition);
        }
        .pm-actions .pm-copy { background: var(--accent); color: var(--bg-primary); }
        .pm-actions .pm-copy:hover { filter: brightness(1.1); }
        .pm-actions .pm-cancel { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .pm-actions .pm-cancel:hover { color: var(--text-primary); }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>依赖图谱 · 点击聚焦层级</h1>
        <div class="stats">
            <span>节点 <span class="num" id="nodeCount">0</span></span>
            <span>连线 <span class="num" id="edgeCount">0</span></span>
            <button class="header-action" id="btnGenPrompt">生成 AI Prompt</button>
        </div>
    </header>

    <div class="app-body">

        <section class="config-panel">
            <div class="panel-label">
                <span>依赖配置 · JSON</span>
                <span class="badge">编辑即更新</span>
            </div>

            <textarea id="jsonEditor" spellcheck="false" placeholder="粘贴或编辑 nodes / links 数据…"></textarea>

            <div class="config-actions">
                <button class="primary" id="btnRender">渲染图表</button>
                <button id="btnClear" class="danger">清空</button>
                <button id="btnResetFocus" class="primary" style="flex:1 0 100%;">重置聚焦 (显示全部)</button>
            </div>

            <div class="slice-bar">
                <span>开发切片 <span class="slice-count" id="sliceCount">0</span> 个</span>
                <button id="btnAddAllSlices">全部添加</button>
                <button id="btnClearSlices">清空切片</button>
            </div>

            <div class="config-hint">
                <code>nodes</code> 含 <code>id</code> <code>path</code> <code>size</code> <code>type</code> ｜
                <code>links</code> 含 <code>source</code> <code>target</code> <code>kind</code> (<code>direct</code> / <code>indirect</code>)
            </div>

            <div class="params-panel">
                <div class="params-title">
                    <span>物理参数（调布局）</span>
                    <button id="btnResetParams">重置默认</button>
                </div>
                <div class="param-row">
                    <label>斥力</label>
                    <input type="range" id="paramCharge" min="-1000" max="-50" step="10" value="-400" />
                    <span class="param-value" id="chargeVal">-400</span>
                </div>
                <div class="param-row">
                    <label>链接距离</label>
                    <input type="range" id="paramDistance" min="50" max="300" step="5" value="120" />
                    <span class="param-value" id="distanceVal">120</span>
                </div>
                <div class="param-row">
                    <label>碰撞半径</label>
                    <input type="range" id="paramCollision" min="0.5" max="3.0" step="0.1" value="1.0" />
                    <span class="param-value" id="collisionVal">1.0</span>
                    <span class="param-unit">×</span>
                </div>
                <div class="param-row">
                    <label>衰减速度</label>
                    <input type="range" id="paramDecay" min="5" max="60" step="1" value="22" />
                    <span class="param-value" id="decayVal">0.022</span>
                </div>
            </div>
        </section>

        <section class="viz-panel" id="vizPanel">
            <div id="vizContainer">
                <div class="viz-loading" id="vizLoading">
                    <div class="spinner"></div>
                    加载中…
                </div>
                <div class="viz-empty hidden" id="vizEmpty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" />
                        <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                        <circle cx="9" cy="9" r="1.5" />
                        <circle cx="15" cy="9" r="1.5" />
                    </svg>
                    <span>暂无数据 · 请通过 /__deps 拉取或编辑 JSON 加载</span>
                </div>
            </div>

            <div class="context-menu" id="contextMenu">
                <div class="menu-header">选择关联层级</div>
                <div class="menu-item" data-level="1"><span>1 级关联</span><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>
                <div class="menu-item" data-level="2"><span>2 级关联</span><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>
                <div class="menu-item" data-level="3"><span>3 级关联</span><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>
                <div class="menu-item" data-level="4"><span>4 级关联</span><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>
                <div class="menu-divider"></div>
                <div class="menu-item slice" data-action="slice"><span>加入 / 移除开发切片</span></div>
            </div>

            <div class="focus-indicator" id="focusIndicator">
                聚焦于 <strong id="focusNodeName"></strong> · 层级 <strong id="focusLevel"></strong>
                (点击重置恢复全部)
            </div>

            <div class="legend" id="legend">
                <div class="legend-item" data-kind="direct" id="legendDirect">
                    <span class="dot" style="background:#4A90D9;"></span>
                    <span class="label">直接依赖</span>
                    <span class="toggle-badge">●</span>
                </div>
                <div class="legend-item" data-kind="indirect" id="legendIndirect">
                    <span class="dot" style="background:#E67E22;"></span>
                    <span class="label">间接依赖</span>
                    <span class="toggle-badge">●</span>
                </div>
                <div class="legend-all">
                    <div class="legend-item" id="legendAll">
                        <span class="label" style="font-size:11px;color:var(--text-muted);">全部显示</span>
                    </div>
                </div>
            </div>
            <div id="tooltip"></div>
        </section>
    </div>

    <div class="prompt-modal" id="promptModal">
        <div class="prompt-panel">
            <div class="pm-header">
                <h2>AI 完备 Prompt 生成器</h2>
                <button class="pm-close" id="pmClose">关闭</button>
            </div>
            <div class="prompt-block">
                <label class="pm-block-title"><input type="checkbox" id="pmCode" checked />[代码] 目录 + 核心契约 + 目标切片</label>
                <div class="pm-toc" id="pmCodeToc" title="点击跳转到对应文件段落"></div>
                <textarea id="pmCodeText" rows="10" spellcheck="false"></textarea>
            </div>
            <div class="prompt-block">
                <label class="pm-block-title"><input type="checkbox" id="pmUser" checked />[用户的话] 本次需求 / 反馈</label>
                <textarea id="pmUserText" rows="3" spellcheck="false" placeholder="填写本次具体需求，例如：修改 waifu 分句逻辑…"></textarea>
            </div>
            <div class="prompt-block">
                <label class="pm-block-title"><input type="checkbox" id="pmAdvisor" />[顾问AI的话] 思路建议（可选）</label>
                <textarea id="pmAdvisorText" rows="3" spellcheck="false" placeholder="粘贴你拿到的思路 / 建议…"></textarea>
            </div>
            <div class="prompt-block">
                <label class="pm-block-title"><input type="checkbox" id="pmDev" checked />[开发AI的话] 开发指令模板</label>
                <textarea id="pmDevText" rows="3" spellcheck="false"></textarea>
            </div>
            <div class="pm-actions">
                <button class="pm-cancel" id="pmCancel">取消</button>
                <button class="pm-copy" id="pmCopy">复制选中内容</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        (function() {
            'use strict';

            // 1. DOM 引用
            const editor = document.getElementById('jsonEditor');
            const btnRender = document.getElementById('btnRender');
            const btnClear = document.getElementById('btnClear');
            const btnResetFocus = document.getElementById('btnResetFocus');
            const container = document.getElementById('vizContainer');
            const loadingEl = document.getElementById('vizLoading');
            const emptyEl = document.getElementById('vizEmpty');
            const nodeCountEl = document.getElementById('nodeCount');
            const edgeCountEl = document.getElementById('edgeCount');
            const tooltipEl = document.getElementById('tooltip');
            const focusIndicator = document.getElementById('focusIndicator');
            const focusNodeName = document.getElementById('focusNodeName');
            const focusLevel = document.getElementById('focusLevel');
            const contextMenu = document.getElementById('contextMenu');

            const paramCharge = document.getElementById('paramCharge');
            const paramDistance = document.getElementById('paramDistance');
            const paramCollision = document.getElementById('paramCollision');
            const paramDecay = document.getElementById('paramDecay');
            const chargeVal = document.getElementById('chargeVal');
            const distanceVal = document.getElementById('distanceVal');
            const collisionVal = document.getElementById('collisionVal');
            const decayVal = document.getElementById('decayVal');
            const btnResetParams = document.getElementById('btnResetParams');

            const legendDirect = document.getElementById('legendDirect');
            const legendIndirect = document.getElementById('legendIndirect');
            const legendAll = document.getElementById('legendAll');

            // 2. 状态变量
            const linkVisibility = { direct: true, indirect: true };
            let focusState = null;
            let currentClickedNodeId = null;
            let fullData = null;
            let simulation = null;
            let renderDebounce = null;
            let resizeTimer = null;
            let selectedSlices = new Set();        // 「开发切片」：已选节点 path 集合（供生成 Prompt 拉取）
            let coreFilesFromServer = [];          // 后端 /__deps 返回的核心契约文件列表（防幻觉基石）

            // 4. 工具函数
            function getNodeColor(type) {
                switch (type) {
                    case 'entry': return '#27AE60';
                    case 'core': return '#8E44AD';
                    case 'engine': return '#2980B9';
                    case 'ui': return '#D35400';
                    case 'plugin': return '#16A085';
                    default: return '#7F8C8D';
                }
            }
            function getLinkColor(kind) { return kind === 'direct' ? '#4A90D9' : '#E67E22'; }
            function getLinkStrokeWidth(kind) { return kind === 'direct' ? 2.0 : 1.4; }
            function getNodeSize(node) { const base = 14; const scale = Math.min(Math.max((node.size || 1) / 10, 0.6), 2.4); return base * scale; }

            function getParams() {
                return {
                    charge: parseInt(paramCharge.value, 10),
                    distance: parseInt(paramDistance.value, 10),
                    collisionScale: parseFloat(paramCollision.value),
                    alphaDecay: parseInt(paramDecay.value, 10) / 1000,
                };
            }
            function updateParamDisplay() {
                chargeVal.textContent = paramCharge.value;
                distanceVal.textContent = paramDistance.value;
                collisionVal.textContent = parseFloat(paramCollision.value).toFixed(1);
                decayVal.textContent = (parseInt(paramDecay.value, 10) / 1000).toFixed(3);
            }

            // 5. 核心过滤算法
            function filterNodesByLevel(allNodes, allLinks, startId, level) {
                if (!startId || level < 1) return { nodes: allNodes, links: allLinks };

                const adj = {};
                allNodes.forEach(n => { adj[n.id] = []; });
                allLinks.forEach(l => {
                    const src = typeof l.source === 'string' ? l.source : l.source.id;
                    const tgt = typeof l.target === 'string' ? l.target : l.target.id;
                    if (adj[src] && adj[tgt]) adj[src].push(tgt);
                });

                const distMap = {};
                const queue = [{ id: startId, dist: 0 }];
                distMap[startId] = 0;

                while (queue.length > 0) {
                    const cur = queue.shift();
                    if (cur.dist >= level) continue;
                    const outNeighbors = adj[cur.id] || [];
                    for (const nb of outNeighbors) {
                        if (distMap[nb] === undefined) {
                            distMap[nb] = cur.dist + 1;
                            queue.push({ id: nb, dist: cur.dist + 1 });
                        }
                    }
                }

                const filteredNodes = allNodes.filter(n => distMap[n.id] !== undefined);
                const filteredLinks = allLinks.filter(l => {
                    const src = typeof l.source === 'string' ? l.source : l.source.id;
                    const tgt = typeof l.target === 'string' ? l.target : l.target.id;
                    return distMap[src] !== undefined && distMap[src] < level && distMap[tgt] !== undefined;
                });

                return { nodes: filteredNodes, links: filteredLinks };
            }

            // 6. 核心渲染器
            function renderGraph(data, params, focusInfo) {
                // 第一步：绝对确保 loading 被隐藏
                loadingEl.classList.add('hidden');
                emptyEl.classList.add('hidden');

                if (!data || !data.nodes || data.nodes.length === 0) {
                    emptyEl.classList.remove('hidden');
                    nodeCountEl.textContent = '0';
                    edgeCountEl.textContent = '0';
                    container.querySelector('svg')?.remove();
                    focusIndicator.style.display = 'none';
                    return;
                }

                let renderData = data;
                if (focusInfo && focusInfo.nodeId) {
                    const filtered = filterNodesByLevel(data.nodes, data.links, focusInfo.nodeId, focusInfo.level);
                    renderData = filtered;
                    focusNodeName.textContent = focusInfo.nodeId;
                    focusLevel.textContent = focusInfo.level;
                    focusIndicator.style.display = 'block';
                } else {
                    focusIndicator.style.display = 'none';
                }

                const allLinks = renderData.links ? renderData.links.map(l => ({ ...l })) : [];
                const visibleLinks = allLinks.filter(l => {
                    const kind = l.kind || 'direct';
                    return linkVisibility[kind] !== false;
                });

                const nodes = renderData.nodes;
                nodeCountEl.textContent = nodes.length;
                edgeCountEl.textContent = visibleLinks.length;

                container.querySelector('svg')?.remove();

                const width = container.clientWidth || 800;
                const height = container.clientHeight || 600;

                const svg = d3.select(container).append('svg')
                    .attr('viewBox', `0 0 ${width} ${height}`)
                    .style('width', '100%').style('height', '100%').style('background', 'transparent');

                const defs = svg.append('defs');
                defs.append('marker').attr('id', 'arrow-direct').attr('viewBox', '0 -5 10 10')
                    .attr('refX', 20).attr('refY', 0).attr('markerWidth', 8).attr('markerHeight', 8).attr('orient', 'auto')
                    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#4A90D9').attr('opacity', 0.7);
                defs.append('marker').attr('id', 'arrow-indirect').attr('viewBox', '0 -5 10 10')
                    .attr('refX', 20).attr('refY', 0).attr('markerWidth', 8).attr('markerHeight', 8).attr('orient', 'auto')
                    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#E67E22').attr('opacity', 0.6);

                const nodeMap = {};
                nodes.forEach(n => { nodeMap[n.id] = n; });

                const positioned = nodes.map(n => ({
                    ...n,
                    x: width * 0.15 + Math.random() * width * 0.7,
                    y: height * 0.15 + Math.random() * height * 0.7,
                }));

                const validLinks = visibleLinks.map(l => ({
                    ...l,
                    source: l.source.id || l.source,
                    target: l.target.id || l.target
                })).filter(l => nodeMap[l.source] && nodeMap[l.target]);

                if (simulation) simulation.stop();

                simulation = d3.forceSimulation(positioned)
                    .force('charge', d3.forceManyBody().strength(params.charge).distanceMax(600))
                    .force('link', d3.forceLink(validLinks).id(d => d.id).distance(params.distance).strength(0.5))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collide', d3.forceCollide().radius(d => getNodeSize(d) * params.collisionScale + 8).strength(0.8))
                    .force('x', d3.forceX(width / 2).strength(0.05))
                    .force('y', d3.forceY(height / 2).strength(0.05))
                    .alphaDecay(params.alphaDecay).alphaMin(0.001);

                const linkGroup = svg.append('g').attr('class', 'links');
                const linkLines = linkGroup.selectAll('line').data(validLinks).enter().append('line')
                    .attr('class', 'link-line')
                    .attr('stroke', d => getLinkColor(d.kind || 'direct'))
                    .attr('stroke-width', d => getLinkStrokeWidth(d.kind || 'direct'))
                    .attr('stroke-opacity', d => d.kind === 'direct' ? 0.75 : 0.5)
                    .attr('marker-end', d => d.kind === 'direct' ? 'url(#arrow-direct)' : 'url(#arrow-indirect)');

                const nodeGroup = svg.append('g').attr('class', 'nodes');
                const nodeCircles = nodeGroup.selectAll('circle').data(positioned).enter().append('circle')
                    .attr('class', d => 'node-circle' + (selectedSlices.has(d.path) ? ' slice-active' : ''))
                    .attr('r', d => getNodeSize(d))
                    .attr('fill', d => getNodeColor(d.type))
                    .attr('fill-opacity', 0.85)
                    .attr('stroke', d => getNodeColor(d.type))
                    .attr('stroke-width', 1.8)
                    .style('cursor', 'pointer')
                    .style('filter', d => d.type === 'entry' ? 'drop-shadow(0 0 10px rgba(39,174,96,0.4))' : 'none');

                const labelGroup = svg.append('g').attr('class', 'labels');
                const labels = labelGroup.selectAll('text').data(positioned).enter().append('text')
                    .attr('class', 'node-label')
                    .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
                    .attr('fill', 'rgba(255,255,255,0.92)')
                    .attr('font-size', d => { const r = getNodeSize(d); return r > 20 ? '13px' : (r > 14 ? '11px' : '9px'); })
                    .attr('font-weight', d => d.type === 'entry' ? '600' : '500')
                    .text(d => d.id.replace(/\.js$/, ''))
                    .style('text-shadow', '0 2px 8px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.6)')
                    .style('pointer-events', 'none');

                const tooltip = d3.select('#tooltip');

                nodeCircles.on('click', function(event, d) {
                    event.stopPropagation();
                    currentClickedNodeId = d.id;

                    const panelRect = document.getElementById('vizPanel').getBoundingClientRect();
                    const x = event.clientX - panelRect.left;
                    const y = event.clientY - panelRect.top;

                    let menuX = x + 10;
                    let menuY = y + 10;
                    const menuWidth = 150;
                    const menuHeight = 160;
                    if (menuX + menuWidth > panelRect.width) menuX = x - menuWidth - 10;
                    if (menuY + menuHeight > panelRect.height) menuY = panelRect.height - menuHeight - 10;

                    contextMenu.style.left = menuX + 'px';
                    contextMenu.style.top = menuY + 'px';

                    const items = contextMenu.querySelectorAll('.menu-item');
                    items.forEach(it => {
                        if (it.getAttribute('data-action') === 'slice') {
                            // 切片项高亮态 = 当前节点是否已在开发切片中
                            const node = fullData ? fullData.nodes.find(n => n.id === d.id) : null;
                            it.classList.toggle('active', !!(node && node.path && selectedSlices.has(node.path)));
                            return;
                        }
                        const lvl = parseInt(it.getAttribute('data-level'), 10);
                        if (focusState && focusState.nodeId === d.id && focusState.level === lvl) {
                            it.classList.add('active');
                        } else {
                            it.classList.remove('active');
                        }
                    });
                    contextMenu.classList.add('visible');
                });

                nodeCircles
                    .on('mouseenter', function(event, d) {
                        if (contextMenu.classList.contains('visible')) return;
                        d3.select(this).transition().duration(160)
                            .attr('stroke-width', 3.5).attr('stroke', 'rgba(255,255,255,0.7)').attr('fill-opacity', 1);
                        const typeLabel = { entry: '入口', core: '核心', engine: '引擎', ui: 'UI', plugin: '插件', default: '文件' } [d.type] || '文件';
                        const depCount = validLinks.filter(l => l.source.id === d.id || l.target.id === d.id).length;
                        const directCount = validLinks.filter(l => (l.source.id === d.id || l.target.id === d.id) && l.kind === 'direct').length;
                        let html = `<div class="tt-title">${d.id}</div><div class="tt-path">${d.path || '—'}</div><div class="tt-detail">`;
                        html += `<span class="tag">${typeLabel}</span>`;
                        if (d.size) html += ` 大小 ${d.size} KB`;
                        html += `  · 关联 ${depCount} 条`;
                        if (directCount > 0) html += ` (直连 ${directCount})`;
                        html += `</div>`;
                        tooltip.html(html).classed('visible', true).style('display', 'block');
                        const [tx, ty] = d3.pointer(event, container);
                        tooltip.style('left', Math.min(tx + 16, container.clientWidth - 320) + 'px').style('top', Math.min(ty + 16, container.clientHeight - 160) + 'px');
                    })
                    .on('mousemove', function(event, d) {
                        if (contextMenu.classList.contains('visible')) return;
                        const [tx, ty] = d3.pointer(event, container);
                        tooltip.style('left', Math.min(tx + 16, container.clientWidth - 320) + 'px').style('top', Math.min(ty + 16, container.clientHeight - 160) + 'px');
                    })
                    .on('mouseleave', function() {
                        d3.select(this).transition().duration(120)
                            .attr('stroke-width', 1.8).attr('stroke', d => getNodeColor(d.type)).attr('fill-opacity', 0.85);
                        tooltip.classed('visible', false).style('display', 'none');
                    });

                const dragHandler = d3.drag()
                    .on('start', function(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on('drag', function(event, d) { d.fx = event.x; d.fy = event.y; })
                    .on('end', function(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; });
                nodeCircles.call(dragHandler);

                simulation.on('tick', () => {
                    linkLines.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                    nodeCircles.attr('cx', d => d.x).attr('cy', d => d.y);
                    labels.attr('x', d => d.x).attr('y', d => d.y);
                });

                const zoom = d3.zoom().scaleExtent([0.3, 2.5]).on('zoom', (event) => { svg.selectAll('g').attr('transform', event.transform); });
                svg.call(zoom);

                updateLegendUI();
            }

            // 7. 图例与聚焦逻辑
            function toggleKind(kind) {
                if (kind === 'direct') linkVisibility.direct = !linkVisibility.direct;
                else if (kind === 'indirect') linkVisibility.indirect = !linkVisibility.indirect;
                if (!linkVisibility.direct && !linkVisibility.indirect) { linkVisibility.direct = true; linkVisibility.indirect = true; }
                triggerRender();
            }
            function setAllVisible(visible) { linkVisibility.direct = visible; linkVisibility.indirect = visible; triggerRender(); }
            function updateLegendUI() {
                legendDirect.classList.toggle('hidden', !linkVisibility.direct);
                legendIndirect.classList.toggle('hidden', !linkVisibility.indirect);
                legendAll.querySelector('.label').textContent = (linkVisibility.direct && linkVisibility.indirect) ? '全部显示' : '全部隐藏';
            }
            function resetFocus() {
                focusState = null;
                focusIndicator.style.display = 'none';
                if (fullData) renderGraph(fullData, getParams(), null);
                else loadFromEditor();
            }

            // 8. 数据加载
            function loadData(data) {
                try {
                    const input = JSON.parse(JSON.stringify(data));
                    if (!input.nodes || !Array.isArray(input.nodes)) throw new Error('nodes 必须是非空数组');
                    if (!input.links) input.links = [];
                    const validNodes = input.nodes.filter(n => n.id && typeof n.id === 'string');
                    if (validNodes.length === 0) throw new Error('至少需要一个有效的节点');
                    input.nodes = validNodes;

                    const nodeIds = new Set(validNodes.map(n => n.id));
                    input.links = input.links.filter(l => {
                        const src = typeof l.source === 'string' ? l.source : l.source?.id;
                        const tgt = typeof l.target === 'string' ? l.target : l.target?.id;
                        return src && tgt && nodeIds.has(src) && nodeIds.has(tgt);
                    });
                    input.links.forEach(l => { if (!l.kind || (l.kind !== 'direct' && l.kind !== 'indirect')) l.kind = 'direct'; });

                    editor.value = JSON.stringify(input, null, 2);
                    fullData = input;
                    focusState = null;
                    renderGraph(fullData, getParams(), null);
                } catch (err) {
                    alert('数据格式错误: ' + err.message + '\n请检查 JSON 结构是否符合规范。');
                    console.error('[依赖可视化] 数据加载失败', err);
                }
            }

            function loadFromEditor() {
                try {
                    const raw = editor.value.trim();
                    if (!raw) {
                        emptyEl.classList.remove('hidden'); loadingEl.classList.add('hidden');
                        container.querySelector('svg')?.remove();
                        nodeCountEl.textContent = '0'; edgeCountEl.textContent = '0';
                        focusIndicator.style.display = 'none'; return;
                    }
                    loadData(JSON.parse(raw));
                } catch (err) {
                    alert('JSON 解析失败: ' + err.message + '\n请检查语法错误。');
                    console.error('[依赖可视化] JSON 解析错误', err);
                }
            }

            function updateSliceCount() {
                const el = document.getElementById('sliceCount');
                if (el) el.textContent = selectedSlices.size;
            }

            // 剥离源码开头的 JSDoc 块注释（仅去掉文件头部的 /** ... */，不影响代码内部的块注释）
            function stripLeadingJsdoc(src) {
                if (typeof src !== 'string' || !src) return src;
                return src.replace(/^\s*\/\*\*[\s\S]*?\*\/\s*/, '');
            }

            // 生成「AI 完备 Prompt」：拉取核心契约与目标切片源码，组装四段式文本
            async function openPromptModal() {
                const codeText = document.getElementById('pmCodeText');
                const userText = document.getElementById('pmUserText');
                const advisorText = document.getElementById('pmAdvisorText');
                const devText = document.getElementById('pmDevText');

                const core = (coreFilesFromServer && coreFilesFromServer.length) ? coreFilesFromServer : [];
                const slices = Array.from(selectedSlices);
                const paths = [...core, ...slices];
                const lines = [];

                // 1. 全局目录：所有节点文件清单（供 AI 快速索引，不再输出头部 JSDoc 注释）
                if (fullData && fullData.nodes) {
                    const filePaths = fullData.nodes.map(n => n.path || n.id);
                    lines.push('【目录】（全部节点文件清单 · 共 ' + filePaths.length + ' 个）');
                    filePaths.forEach((p, i) => { lines.push((i + 1) + '. ' + p); });
                    lines.push('');
                    renderCodeToc(filePaths);
                } else {
                    lines.push('【目录】（暂无图谱数据）');
                    renderCodeToc([]);
                }

                // 2+3. 核心契约 + 目标切片：经 /__code 拉取真实源码
                if (paths.length) {
                    try {
                        const res = await fetch('/__code?paths=' + encodeURIComponent(paths.join(',')));
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const fileMap = {};
                        (data.files || []).forEach(f => {
                            let s = f.source || (f.error ? '// 读取失败：' + f.error : '');
                            if (!f.error) s = stripLeadingJsdoc(s);
                            fileMap[f.path] = s;
                        });

                        lines.push('【全局核心契约】（防幻觉基石 · 宿主契约与核心状态，来自后端 coreFiles 配置）');
                        if (core.length) {
                            core.forEach(p => { lines.push('### ' + p); lines.push(fileMap[p] || '(读取失败)'); lines.push(''); });
                        } else {
                            lines.push('(后端未配置 coreFiles)');
                        }

                        lines.push('【目标代码切片】（本次要改动的文件 · 由你在图谱中右键选取）');
                        if (slices.length) {
                            slices.forEach(p => { lines.push('### ' + p); lines.push(fileMap[p] || '(读取失败)'); lines.push(''); });
                        } else {
                            lines.push('(未选择任何切片 — 在图谱中右键节点，选「加入 / 移除开发切片」)');
                        }
                    } catch (err) {
                        lines.push('【代码拉取失败】' + err.message);
                    }
                } else {
                    lines.push('【代码】（未选择切片，且后端未配置核心契约）');
                }

                codeText.value = lines.join('\n');
                userText.value = '';
                advisorText.value = '';
                devText.value = '请基于上述【目录】与【全局核心契约】，不要臆造变量、类名或 CSS token；';
                document.getElementById('promptModal').classList.add('visible');
            }

            // 渲染 [代码] 区块的交互目录：点击 chip 跳转到 textarea 对应文件段落
            function renderCodeToc(filePaths) {
                const toc = document.getElementById('pmCodeToc');
                if (!toc) return;
                toc.innerHTML = '';
                filePaths.forEach(p => {
                    const chip = document.createElement('span');
                    chip.className = 'toc-chip';
                    chip.textContent = p;
                    chip.title = '点击跳转：' + p;
                    chip.addEventListener('click', () => scrollToFileInTextarea(document.getElementById('pmCodeText'), p));
                    toc.appendChild(chip);
                });
            }

            // 定位 textarea 中某文件的「### path」标题并滚动到视野中部
            function scrollToFileInTextarea(ta, path) {
                if (!ta) return;
                const marker = '### ' + path;
                const idx = ta.value.indexOf(marker);
                if (idx < 0) return;
                const line = ta.value.slice(0, idx).split('\n').length - 1;
                const lineHeight = parseFloat(getComputedStyle(ta).lineHeight) || 18;
                ta.scrollTop = Math.max(0, line * lineHeight - ta.clientHeight / 2);
                ta.focus();
                try { ta.setSelectionRange(idx, idx + marker.length); } catch (e) { /* 兼容 */ }
            }

            function copyCheckedPrompt() {
                const blocks = [];
                const grab = (id) => document.getElementById(id).value.trim();
                if (document.getElementById('pmCode').checked && grab('pmCodeText')) blocks.push('[代码]\n' + grab('pmCodeText'));
                if (document.getElementById('pmUser').checked && grab('pmUserText')) blocks.push('[用户的话]\n' + grab('pmUserText'));
                if (document.getElementById('pmAdvisor').checked && grab('pmAdvisorText')) blocks.push('[顾问AI的话]\n' + grab('pmAdvisorText'));
                if (document.getElementById('pmDev').checked && grab('pmDevText')) blocks.push('[开发AI的话]\n' + grab('pmDevText'));
                if (!blocks.length) { alert('没有勾选任何内容'); return; }
                const text = blocks.join('\n\n=====\n\n');
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('pmCopy');
                    const old = btn.textContent;
                    btn.textContent = '已复制';
                    setTimeout(() => { btn.textContent = old; }, 1200);
                }).catch(() => alert('复制失败，请手动选择复制'));
            }

            function clearData() {
                editor.value = ''; container.querySelector('svg')?.remove();
                emptyEl.classList.remove('hidden'); loadingEl.classList.add('hidden');
                nodeCountEl.textContent = '0'; edgeCountEl.textContent = '0';
                fullData = null; focusState = null;
                focusIndicator.style.display = 'none';
                tooltipEl.classed('visible', false).style('display', 'none');
                linkVisibility.direct = true; linkVisibility.indirect = true;
                updateLegendUI();
            }

            function triggerRender() {
                clearTimeout(renderDebounce);
                renderDebounce = setTimeout(() => {
                    const params = getParams();
                    if (fullData) {
                        renderGraph(fullData, params, focusState);
                    } else {
                        const raw = editor.value.trim();
                        if (!raw) return;
                        try { loadData(JSON.parse(raw)); } catch (e) { console.warn('[参数调整] JSON 无效'); }
                    }
                }, 300);
            }

            // 9. 初始化执行入口
            function init() {
                updateParamDisplay();

                // 按钮事件
                btnRender.addEventListener('click', loadFromEditor);
                btnClear.addEventListener('click', clearData);
                btnResetParams.addEventListener('click', () => {
                    paramCharge.value = '-400'; paramDistance.value = '120';
                    paramCollision.value = '1.0'; paramDecay.value = '22';
                    updateParamDisplay(); triggerRender();
                });
                btnResetFocus.addEventListener('click', resetFocus);

                // 开发切片：清空
                document.getElementById('btnClearSlices').addEventListener('click', () => {
                    selectedSlices.clear();
                    updateSliceCount();
                    if (fullData) renderGraph(fullData, getParams(), focusState);
                });

                // 开发切片：全部添加（仅当前图谱节点，聚焦态下为可见节点子集）
                document.getElementById('btnAddAllSlices').addEventListener('click', () => {
                    if (!fullData || !fullData.nodes) return;
                    fullData.nodes.forEach(n => {
                        const p = n.path || n.id;
                        if (p) selectedSlices.add(p);
                    });
                    updateSliceCount();
                    renderGraph(fullData, getParams(), focusState);
                });

                // 生成 / 复制 AI Prompt
                document.getElementById('btnGenPrompt').addEventListener('click', openPromptModal);
                document.getElementById('pmClose').addEventListener('click', () => document.getElementById('promptModal').classList.remove('visible'));
                document.getElementById('pmCancel').addEventListener('click', () => document.getElementById('promptModal').classList.remove('visible'));
                document.getElementById('pmCopy').addEventListener('click', copyCheckedPrompt);
                document.getElementById('promptModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('promptModal')) document.getElementById('promptModal').classList.remove('visible');
                });

                // 滑块事件
                [paramCharge, paramDistance, paramCollision, paramDecay].forEach(slider => {
                    slider.addEventListener('input', () => { updateParamDisplay(); triggerRender(); });
                });

                // 图例点击
                legendDirect.addEventListener('click', () => toggleKind('direct'));
                legendIndirect.addEventListener('click', () => toggleKind('indirect'));
                legendAll.addEventListener('click', () => setAllVisible(!(linkVisibility.direct && linkVisibility.indirect)));

                // 编辑器快捷键
                editor.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); loadFromEditor(); }
                });

                // 菜单点击
                contextMenu.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const action = this.getAttribute('data-action');
                        if (action === 'slice') {
                            // 加入 / 移除开发切片
                            if (currentClickedNodeId && fullData) {
                                const node = fullData.nodes.find(n => n.id === currentClickedNodeId);
                                if (node && node.path) {
                                    if (selectedSlices.has(node.path)) selectedSlices.delete(node.path);
                                    else selectedSlices.add(node.path);
                                    updateSliceCount();
                                    renderGraph(fullData, getParams(), focusState);
                                }
                            }
                        } else {
                            const lvl = parseInt(this.getAttribute('data-level'), 10);
                            if (currentClickedNodeId) {
                                focusState = { nodeId: currentClickedNodeId, level: lvl };
                                if (fullData) renderGraph(fullData, getParams(), focusState);
                            }
                        }
                        contextMenu.classList.remove('visible');
                    });
                });

                document.addEventListener('click', function(e) {
                    if (!contextMenu.contains(e.target)) contextMenu.classList.remove('visible');
                });

                // 窗口缩放
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => { if (fullData) renderGraph(fullData, getParams(), focusState); }, 300);
                });
                new ResizeObserver(() => {
                    if (fullData) {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(() => { renderGraph(fullData, getParams(), focusState); }, 200);
                    }
                }).observe(container);

                // 首次载入：从 Vite 插件拉取真实依赖数据（dev 服务器 /__deps 接口）
                async function loadRealDeps() {
                    try {
                        const res = await fetch('/__deps');
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        if (data.error) throw new Error(data.error);
                        if (!data.nodes || data.nodes.length === 0) {
                            emptyEl.querySelector('span').textContent = '依赖图为空 —— 请先打开主应用页面一次（/）以触发 Vite 构建模块图，再刷新本页';
                            emptyEl.classList.remove('hidden');
                            loadingEl.classList.add('hidden');
                            return;
                        }
                        loadData(data);
                        coreFilesFromServer = (data.coreFiles || []).slice(); // 记住防幻觉基石清单，供生成 Prompt
                    } catch (err) {
                        console.error('拉取依赖数据失败', err);
                        emptyEl.querySelector('span').textContent = '拉取 /__deps 失败：' + err.message + '（请通过 启动LI-deps.bat 或 npm run dev 启动）';
                        emptyEl.classList.add('viz-error');
                        emptyEl.classList.remove('hidden');
                        loadingEl.classList.add('hidden');
                    }
                }
                loadRealDeps();
            }

            // 确保 DOM 加载完毕后执行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
